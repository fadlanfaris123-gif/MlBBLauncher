name: Build MLBBLauncher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/mlbblauncher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MLBBLauncher"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.mlbblauncher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.mlbblauncher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="MLBBLauncher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/mlbblauncher/MainActivity.java <<'EOF'
          package com.example.mlbblauncher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.*;

          public class MainActivity extends Activity {
              EditText deviceId, packageName;
              SharedPreferences prefs;

              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("settings", MODE_PRIVATE);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(1);
                  layout.setPadding(30, 30, 30, 30);

                  TextView title = new TextView(this);
                  title.setText("MLBBLauncher");
                  title.setTextSize(26);
                  layout.addView(title);

                  deviceId = new EditText(this);
                  deviceId.setHint("Device ID");
                  deviceId.setText(prefs.getString("device_id", ""));
                  layout.addView(deviceId);

                  packageName = new EditText(this);
                  packageName.setHint("Package Name MLBB");
                  packageName.setText(prefs.getString("package_name", "com.mobile.legends"));
                  layout.addView(packageName);

                  Button save = new Button(this);
                  save.setText("SIMPAN");
                  save.setOnClickListener(v -> {
                      prefs.edit()
                          .putString("device_id", deviceId.getText().toString())
                          .putString("package_name", packageName.getText().toString())
                          .apply();
                      Toast.makeText(this, "Tersimpan", Toast.LENGTH_SHORT).show();
                  });
                  layout.addView(save);

                  Button open = new Button(this);
                  open.setText("BUKA MOBILE LEGENDS");
                  open.setOnClickListener(v -> {
                      String pkg = packageName.getText().toString().trim();
                      Intent intent = getPackageManager().getLaunchIntentForPackage(pkg);
                      if (intent != null) {
                          startActivity(intent);
                      } else {
                          Toast.makeText(this, "Aplikasi tidak ditemukan. Periksa Package Name.", Toast.LENGTH_LONG).show();
                      }
                  });
                  layout.addView(open);

                  setContentView(layout);
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MLBBLauncher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLBBLauncher
          path: MLBBLauncher.apk
