name: Build MLBBLauncher APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project files
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/mlbblauncher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MLBBLauncher"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.mlbblauncher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.mlbblauncher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="false"
                  android:label="MLBBLauncher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/mlbblauncher/MainActivity.java <<'EOF'
          package com.example.mlbblauncher;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private EditText deviceIdInput;
              private EditText packageInput;
              private SharedPreferences preferences;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  preferences = getSharedPreferences("launcher_settings", MODE_PRIVATE);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  int pad = (int) (20 * getResources().getDisplayMetrics().density);
                  layout.setPadding(pad, pad, pad, pad);

                  TextView title = new TextView(this);
                  title.setText("MLBBLauncher");
                  title.setTextSize(25);
                  layout.addView(title, params());

                  TextView note = new TextView(this);
                  note.setText("Simpan Device ID dan buka aplikasi MLBB. Device ID tidak digunakan untuk login akun.");
                  note.setPadding(0, pad / 2, 0, pad / 2);
                  layout.addView(note, params());

                  deviceIdInput = new EditText(this);
                  deviceIdInput.setHint("Device ID (opsional)");
                  deviceIdInput.setText(preferences.getString("device_id", ""));
                  layout.addView(deviceIdInput, params());

                  packageInput = new EditText(this);
                  packageInput.setHint("Package aplikasi MLBB");
                  packageInput.setSingleLine(true);
                  packageInput.setText(preferences.getString("package_name", "com.mobile.legends"));
                  layout.addView(packageInput, params());

                  Button save = new Button(this);
                  save.setText("SIMPAN");
                  save.setOnClickListener(v -> {
                      preferences.edit()
                          .putString("device_id", deviceIdInput.getText().toString().trim())
                          .putString("package_name", packageInput.getText().toString().trim())
                          .apply();
                      Toast.makeText(this, "Pengaturan tersimpan", Toast.LENGTH_SHORT).show();
                  });
                  layout.addView(save, params());

                  Button open = new Button(this);
                  open.setText("BUKA MOBILE LEGENDS");
                  open.setOnClickListener(v -> launchTarget());
                  layout.addView(open, params());

                  setContentView(layout);
              }

              private void launchTarget() {
                  String packageName = packageInput.getText().toString().trim();
                  if (packageName.isEmpty()) {
                      Toast.makeText(this, "Isi package aplikasi terlebih dahulu", Toast.LENGTH_LONG).show();
                      return;
                  }
                  Intent intent = getPackageManager().getLaunchIntentForPackage(packageName);
                  if (intent == null) {
                      Toast.makeText(this, "Aplikasi tidak ditemukan. Periksa package name MLBB.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  startActivity(intent);
              }

              private LinearLayout.LayoutParams params() {
                  return new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  );
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MLBBLauncher.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLBBLauncher
          path: MLBBLauncher.apk
          if-no-files-found: error
